<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>fes-treact-project</title>
    <link rel="stylesheet" href="styles.css">
</head>


<body>
    <section id="landing">
        <nav>
            <div class="row nav__row">
                <div class="logo__wrapper">
                    <div class="nav__logo">
                        <img class="logo__img" src="/assets/logo.2c489fc453a1783cbadacf914efa3df6.svg">
                        <a class="logo__link">Treact</a>
                    </div>
                </div>
                <div class="nav__links">
                    <a class="nav__link">About</a>
                    <a class="nav__link">Blog</a>
                    <a class="nav__link">Pricing</a>
                    <a class="nav__link">Contact Us</a>
                    <a class="nav__link nav__link-secondary">Login</a>
                    <a class="nav__link nav__link-primary">Sign Up</a>
                </div>        
                    
            </div>
        </nav>
        
        <div class="modal"></div>

        <div class="modal__links"></div>
        
        
        
        <header>
            <div class="container">
                <div class="row">
                    <div class="about__wrapper">
                        <div class="about__left--wrapper">
                            <h1 class="header__about">Beautiful React Templates <span class="purple">for you</span>
                            </h1>
                            <p class="about__para"> Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.</p>
                            <div class="input__wrapper">
                                <input type="email" placeholder="Your E-mail Address">
                                <button class="btn__input">Get Started</button>
                            </div>        
                            <div class="about__customers--wrapper">
                                <p>OUR TRUSTED CUSTOMERS</p>
                                <img class="customers" src="/assets/customers-logo-strip.680ac7c2e8ae28161d2c.png">
                            </div>
                        </div>
                        <div class="about__right--wrapper">
                            <img class="about__img" src="/assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg">
                        </div>
                    </div>
                </div>
            </div>
        </header>        
    </section>
</body>
</html>
